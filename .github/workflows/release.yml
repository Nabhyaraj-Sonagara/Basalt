name: Release

# Push a version tag (npm run release -- 0.2.0, then git push origin v0.2.0) to build
# installers for macOS, Windows and Linux and publish them as a GitHub Release.
# The desktop app's auto-updater reads that release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (for example v0.2.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional signing. Add these as repository secrets when you have certificates;
      # without them, macOS builds are ad-hoc signed and Windows builds are unsigned.
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      WIN_CSC_LINK: ${{ secrets.WIN_CERTIFICATE_P12_BASE64 }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check the tag matches the app version
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$tag" != "v$version" ]; then echo "Tag $tag doesn't match apps/desktop version $version"; exit 1; fi
      - name: Prepare the App Store Connect key for notarization
        if: runner.os == 'macOS' && env.APPLE_API_KEY_ID != ''
        shell: bash
        run: |
          echo "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
      - name: Build and upload installers
        shell: bash
        run: |
          extra=""
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$CSC_LINK" ]; then
            extra="--config.mac.identity=-"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "$WIN_CSC_LINK" ]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          npm run tokens
          npm run build -w @basalt/cli
          cd apps/desktop
          npx electron-vite build
          npx electron-builder --publish always $extra
      - name: Launch the packaged app
        shell: bash
        run: node apps/desktop/e2e/launch-packaged.mjs

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Turn the draft into a published release
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest \
            --notes "Download Basalt for your platform below, or from https://nabhyaraj-sonagara.github.io/Basalt/. Builds aren't code-signed yet; see the README for the one-time first-launch step."
