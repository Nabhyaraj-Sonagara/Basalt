name: basalt
# Basalt Sync on one server: the sync API, Postgres, and Caddy for HTTPS.
# Usage: cp .env.example .env, edit it, then: docker compose up -d   (or run setup.sh, which does both)
x-logging: &logging
  # Keep container logs from filling the disk.
  driver: json-file
  options: { max-size: 10m, max-file: '3' }

services:
  sync:
    image: ${SYNC_IMAGE:-ghcr.io/nabhyaraj-sonagara/basalt-sync:latest}
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgres://basalt:${POSTGRES_PASSWORD}@db:5432/basalt
      SERVER_SECRET: ${SERVER_SECRET}
      # Notes-only limits; see .env.example.
      QUOTA_BYTES: ${QUOTA_BYTES:-104857600}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-2097152}
      MAX_FILES: ${MAX_FILES:-20000}
      TRANSFER_BYTES_PER_DAY: ${TRANSFER_BYTES_PER_DAY:-1073741824}
      MAX_USERS: ${MAX_USERS:-100}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      TRUST_PROXY: 'true'
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
    volumes:
      - blobs:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: basalt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: basalt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U basalt -d basalt']
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sync

volumes:
  blobs:
  pgdata:
  caddy_data:
  caddy_config:
